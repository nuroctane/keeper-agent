name: Source checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[keeper,browser,test]' 'setuptools>=84.1.0' pip-audit
      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable
      - name: Install synthetic workflow browser
        run: python -m playwright install chromium --only-shell
      - name: Test broker and administrator
        env:
          KEEPER_AGENT_BROWSER_TEST: '1'
        run: python -m pytest -q
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install backend for synthetic web tests
        run: python -m pip install -e '..[keeper,browser,test]'
      - name: Install locked frontend dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild --ignore-scripts=false
      - name: Check known high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Check formatting and build
        run: |
          npm run format:check
          npm run build
      - name: Install interface test browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test desktop preview and authenticated web app
        env:
          KEEPER_AGENT_TEST_PYTHON: python
        run: |
          npm test
          npx playwright test --config playwright.web.config.ts
