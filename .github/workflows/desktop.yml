name: Desktop development builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install -e '.[keeper,browser,test]' pyinstaller==6.22.3
          python -m playwright install chromium --only-shell
      - name: Test backend
        env:
          KEEPER_AGENT_BROWSER_TEST: '1'
        run: python -m pytest -q
      - name: Install frontend
        working-directory: desktop
        run: npm ci
      - name: Test frontend
        working-directory: desktop
        run: |
          npx playwright install chromium --only-shell
          npm test
      - name: Package Python runtime
        run: python desktop/scripts/package_core.py
      - name: Smoke-test packaged runtime
        shell: bash
        run: |
          core=work/sidecar/keeper-agent-core/keeper-agent-core
          if [ "$RUNNER_OS" = "Windows" ]; then core="$core.exe"; fi
          python desktop/scripts/smoke_core.py "$core"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run desktop:build -- --bundles nsis
      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run desktop:build -- --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-agent-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
